packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  "@biomejs/biome": true
  better-sqlite3: true

# Single source of truth for third-party versions across every workspace package.
# Referenced from package.json as "catalog:". Keeping versions here makes
# dependency review (SECURITY.md) a one-file exercise.
catalog:
  "@fastify/cookie": 11.1.5
  "@fastify/formbody": 9.0.1
  "@fastify/helmet": 13.2.0
  "@fastify/rate-limit": 11.2.2
  "@inquirer/prompts": 8.8.0
  "@modelcontextprotocol/sdk": 1.32.2
  "@types/better-sqlite3": 9.6.0
  "@types/node": 22.20.5
  better-sqlite3: 13.1.1
  commander: 15.1.0
  fastify: 5.12.8
  grammy: 1.46.0
  typescript: 5.9.3
  vitest: 4.1.12
  yaml: 2.9.1
  zod: 4.6.7

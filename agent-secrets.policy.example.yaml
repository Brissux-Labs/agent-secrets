# =============================================================================
# agent-secrets.policy.yaml — example policy file
# =============================================================================
#
# Copy to `agent-secrets.policy.yaml`. This file decides what an agent is allowed
# to do; the decision is made in code, not in a prompt, so an agent that has been
# talked into asking for a production rotation still gets POLICY_DENIED.
#
# Rules of the format:
#
#  * Deny by default. An action absent from an `allow` list is denied. There is
#    no wildcard and no `allow: all`.
#  * Unknown keys are a hard error. A malformed policy file does not degrade to
#    "no restrictions"; the CLI refuses to run.
#  * Deleting this file is safe: the built-in defaults apply, and they are
#    stricter than most policies people write (development fully usable, preview
#    read-only plus run, production read-only).
#  * `humanApproval` is not `allow`. An action can be permitted AND still require
#    a gate outside the model — obtained through a channel the agent does not
#    control, such as a Telegram confirmation.
#
# Actions:
#   list             enumerate secret names in a scope (metadata only)
#   describe         show one secret's metadata (never its value)
#   request-create   issue a one-time link for a human to enter a new value
#   request-rotate   issue a one-time link for a human to replace a value
#   create           write a new value directly (needs a value in hand)
#   rotate           replace a value directly
#   delete           remove a secret
#   run              inject secrets into a child process environment
#
# Note the asymmetry that matters: `request-create` is safe to give an agent —
# it produces a link a human types into — while `create` requires the agent to
# already hold a value, which is the situation this product exists to avoid.
# =============================================================================

version: 1

projects:
  # Project slug: ^[a-z0-9][a-z0-9-]{0,62}$. A project not listed here falls back
  # to the built-in defaults, which are restrictive; listing it makes the
  # decision explicit and reviewable.
  acme-store:
    environments:
      # Only 'development', 'preview' and 'production' are valid keys.
      development:
        # Everything, including direct writes. A leaked development credential
        # is a bad day; the same freedom in production is an incident.
        allow:
          - list
          - describe
          - request-create
          - request-rotate
          - create
          - rotate
          - delete
          - run
        humanApproval: []

      preview:
        # Read, run, and ask a human to fill in a value. No direct writes and no
        # deletes: shared state that other people are looking at.
        allow:
          - list
          - describe
          - request-create
          - request-rotate
          - run
        humanApproval:
          - request-create
          - request-rotate

      production:
        # Metadata only. Note what is missing: `run` is not here, so an agent
        # cannot start a process with production credentials even though it can
        # see that they exist.
        #
        # To allow a production deploy, add `run` to this list and to
        # `humanApproval`. Do that in a reviewed commit, never as a quick local
        # edit — this file is the audit trail for that decision.
        allow:
          - list
          - describe
        humanApproval: []

  # A second project with a narrower grant: this agent may look and ask, and
  # nothing else.
  internal-tools:
    environments:
      development:
        allow:
          - list
          - describe
          - request-create
          - run
        humanApproval:
          - request-create
      preview:
        allow:
          - list
          - describe
        humanApproval: []
      production:
        allow: []
        humanApproval: []

commands:
  # Executables that must never receive injected secrets, compared on the
  # basename so `/bin/sh` and `sh` are the same rule.
  #
  # Honest limitation: a denylist is porous against a determined agent — it can
  # write a script and run that instead. What it reliably stops is the common
  # accident: `agent-secrets run -- env` dumping every injected credential into a
  # transcript that an AI model is reading.
  denyExecutables:
    - env
    - printenv
    - sh
    - bash
    - zsh
    - dash
    - fish
    - ksh
    - eval

  # When non-empty, ONLY these executables may be run. This is the strong form of
  # the rule above and the one to use for an agent you do not supervise closely.
  # Leave empty to allow anything not denied.
  allowExecutables: []
  # allowExecutables:
  #   - pnpm
  #   - npm
  #   - node

# =============================================================================
# agent-secrets.yaml — example command manifest
# =============================================================================
#
# Copy this file to `agent-secrets.yaml` at the root of your project and commit
# it. It declares which secrets each command needs, so that an agent asking to
# run `dev` gets exactly the credentials the repository already agreed to hand
# it — instead of the agent deciding that for itself.
#
# It contains NO VALUES, only names. That is what makes it safe to commit and
# safe to review in a pull request like any other code.
#
# Two things to know before editing:
#
#  1. Unknown keys are a hard error, not a warning. A manifest written for a
#     future version is rejected by this one rather than parsed with the part it
#     does not understand silently dropped.
#  2. The manifest is untrusted input. The first time you run a command — and
#     every time the file changes — you are shown the exact argument array and
#     must approve it. The approval is keyed to a hash of the file, so an edited
#     command is a new approval, never an inherited one.
# =============================================================================

version: 1

# Project slug: ^[a-z0-9][a-z0-9-]{0,62}$. It is the middle segment of every
# reference, e.g. bitwarden/acme-store/development/OPENAI_API_KEY.
project: acme-store

commands:
  # Command name: ^[a-z0-9][a-z0-9:_-]{0,63}$. Invoked as:
  #   agent-secrets run dev
  dev:
    description: Local development server with development credentials.

    # Required, never inferred. Omitting it is an error; there is deliberately no
    # default, because the convenient default would be the dangerous one.
    environment: development

    # Secret names: ^[A-Z][A-Z0-9_]{0,127}$. Each is resolved in the scope above
    # and injected into the child process environment — and nowhere else. Names
    # not listed here are not injected, even if they exist in the vault.
    secrets:
      - OPENAI_API_KEY
      - DATABASE_URL
      - STRIPE_SECRET_KEY

    # An argument array, never a shell string. There is no shell: the first entry
    # is the executable and the rest are its arguments, passed through execFile.
    # This is why `npm run dev && curl attacker.example` cannot be expressed here.
    command: [pnpm, dev]

    # 'none' or 'required'. Development commands usually need no gate.
    approval: none

  test:
    description: Test suite against the development vault.
    environment: development
    secrets:
      - DATABASE_URL
    command: [pnpm, test]
    approval: none

  db:migrate:
    description: Apply migrations to the preview database.
    environment: preview
    secrets:
      - DATABASE_URL
    command: [pnpm, drizzle-kit, migrate]
    # Preview touches shared state, so a human confirms out of band before the
    # child process starts. The agent cannot satisfy this itself — that is the
    # point of it.
    approval: required

  # A production command is written down like any other, but it is governed by
  # the policy file as well as by this manifest. With the default policy, the
  # `run` action is not allowed in production at all, so this entry stays inert
  # until someone writes that permission down in agent-secrets.policy.yaml.
  deploy:
    description: Production deploy. Requires an explicit policy grant AND approval.
    environment: production
    secrets:
      - DEPLOY_TOKEN
    command: [pnpm, deploy, --production]
    approval: required
